<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoWall - 照片墙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
    }

    .header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      font-weight: 600;
    }

    /* 照片网格 */
    #photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      padding: 10px 0;
    }

    .photo-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .photo-card .photo-info {
      padding: 10px 12px;
      font-size: 12px;
      color: #999;
    }

    .photo-card .delete-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(220, 53, 69, 0.9);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      z-index: 2;
    }

    .photo-card .delete-btn:hover {
      background: rgba(200, 35, 51, 1);
    }

    /* 管理模式下显示删除按钮 */
    body.admin-mode .photo-card .delete-btn {
      display: block;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
      font-size: 16px;
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* Loading 骨架屏 */
    .skeleton-card {
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .skeleton-img {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-text {
      height: 12px;
      margin: 10px 12px;
      border-radius: 4px;
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      width: 60%;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 24px;
      color: #ccc;
      font-size: 13px;
    }

    /* 密码弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #333;
    }

    .modal-box input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-box input[type="password"]:focus {
      border-color: #4a90d9;
    }

    .modal-box .modal-error {
      color: #dc3545;
      font-size: 13px;
      margin-top: 8px;
      min-height: 20px;
    }

    .modal-box .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-end;
    }

    .modal-box .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-box .btn-cancel {
      background: #f0f0f0;
      color: #666;
    }

    .modal-box .btn-cancel:hover {
      background: #e0e0e0;
    }

    .modal-box .btn-confirm {
      background: #4a90d9;
      color: #fff;
    }

    .modal-box .btn-confirm:hover {
      background: #3a7bc8;
    }

    /* 上传区域 */
    .upload-area {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body.admin-mode .upload-area {
      display: block;
    }

    .upload-area .upload-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }

    .upload-dropzone {
      border: 2px dashed #d0d0d0;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      color: #999;
    }

    .upload-dropzone:hover,
    .upload-dropzone.dragover {
      border-color: #4a90d9;
      background: #f0f7ff;
      color: #4a90d9;
    }

    .upload-dropzone .drop-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .upload-dropzone .drop-text {
      font-size: 14px;
    }

    .upload-dropzone .drop-hint {
      font-size: 12px;
      margin-top: 6px;
      color: #bbb;
    }

    /* 上传进度 */
    .upload-progress {
      margin-top: 12px;
    }

    .upload-progress-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      color: #666;
    }

    .upload-progress-bar {
      flex: 1;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .upload-progress-bar-fill {
      height: 100%;
      background: #4a90d9;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .upload-progress-item.error {
      color: #dc3545;
    }

    .upload-progress-item.done {
      color: #28a745;
    }

    /* 退出按钮 */
    .admin-bar {
      display: none;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    body.admin-mode .admin-bar {
      display: flex;
    }

    .btn-logout {
      padding: 8px 16px;
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #e0e0e0;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .container { padding: 12px; }
      .header h1 { font-size: 22px; }
      #photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .upload-area { padding: 16px; }
      .upload-dropzone { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PhotoWall</h1>
    </div>
    <div id="photo-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="empty-icon">&#128247;</div>
      <p>还没有照片，期待第一张上传</p>
    </div>
  </div>
  <div class="footer">PhotoWall - 照片墙</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  (function() {
    'use strict';

    // ========== Supabase 配置 ==========
    const SUPABASE_URL = 'https://vzkrowpfafiujbhqtmtm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6a3Jvd3BmYWZpdWpiaHF0bXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTI2NjksImV4cCI6MjA5NDE2ODY2OX0.Db7b6_v45dCT5Nni31bSn8PLMWsp9aX1mYEhIG5ehdA';
    const ADMIN_PASSWORD = '123';
    const SESSION_KEY = 'pw_admin';
    const SESSION_DURATION = 24 * 60 * 60 * 1000;

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========== DOM 引用 ==========
    const photoGrid = document.getElementById('photo-grid');
    const emptyState = document.getElementById('empty-state');

    // ========== 状态 ==========
    let isAdmin = false;
    let aKeyCount = 0;
    let aKeyTimer = null;

    // ========== 工具函数 ==========
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }

    function generateFilename(originalName) {
      const ext = originalName.split('.').pop().toLowerCase();
      return Date.now() + '-' + Math.random().toString(36).substring(2, 8) + '.' + ext;
    }

    // ========== 骨架屏 ==========
    function showSkeletons(count) {
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        card.innerHTML = '<div class="skeleton-img"></div><div class="skeleton-text"></div>';
        photoGrid.appendChild(card);
      }
    }

    function removeSkeletons() {
      photoGrid.querySelectorAll('.skeleton-card').forEach(function(el) { el.remove(); });
    }

    // ========== 照片渲染 ==========
    function createPhotoCard(photo) {
      var card = document.createElement('div');
      card.className = 'photo-card';
      card.dataset.id = photo.id;

      var img = document.createElement('img');
      img.src = photo.public_url;
      img.alt = photo.original_name;
      img.loading = 'lazy';

      var info = document.createElement('div');
      info.className = 'photo-info';
      info.textContent = formatDate(photo.created_at) + ' · ' + formatSize(photo.file_size);

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '删除';
      deleteBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        handleDelete(photo.id, photo.storage_path, card);
      });

      card.appendChild(deleteBtn);
      card.appendChild(img);
      card.appendChild(info);
      return card;
    }

    function renderPhotos(photos) {
      photoGrid.innerHTML = '';
      if (photos.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        photos.forEach(function(photo) {
          photoGrid.appendChild(createPhotoCard(photo));
        });
      }
    }

    // ========== 加载照片 ==========
    async function loadPhotos() {
      showSkeletons(6);
      try {
        var { data, error } = await supabase
          .from('photos')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        removeSkeletons();
        renderPhotos(data || []);
      } catch (err) {
        removeSkeletons();
        console.error('加载照片失败:', err);
        emptyState.style.display = 'block';
        emptyState.querySelector('p').textContent = '加载失败，请刷新重试';
      }
    }

    // ========== Realtime 订阅 ==========
    function subscribeRealtime() {
      var channel = supabase
        .channel('photos-realtime')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'photos' },
          function(payload) {
            var photo = payload.new;
            if (!photo) return;
            emptyState.style.display = 'none';
            var card = createPhotoCard(photo);
            if (photoGrid.firstChild) {
              photoGrid.insertBefore(card, photoGrid.firstChild);
            } else {
              photoGrid.appendChild(card);
            }
          }
        )
        .on('postgres_changes',
          { event: 'DELETE', schema: 'public', table: 'photos' },
          function(payload) {
            var photo = payload.old;
            if (!photo) return;
            var card = photoGrid.querySelector('[data-id="' + photo.id + '"]');
            if (card) card.remove();
            if (photoGrid.children.length === 0) {
              emptyState.style.display = 'block';
              emptyState.querySelector('p').textContent = '还没有照片，期待第一张上传';
            }
          }
        )
        .subscribe();

      return channel;
    }

    // ========== 管理员登录逻辑 ==========
    function checkAdminSession() {
      try {
        var raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return false;
        var session = JSON.parse(raw);
        if (session.isAdmin && Date.now() < session.expire) return true;
        sessionStorage.removeItem(SESSION_KEY);
        return false;
      } catch(e) {
        return false;
      }
    }

    function saveAdminSession() {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        isAdmin: true,
        expire: Date.now() + SESSION_DURATION
      }));
    }

    function enterAdminMode() {
      isAdmin = true;
      document.body.classList.add('admin-mode');
      injectAdminUI();
    }

    function exitAdminMode() {
      isAdmin = false;
      document.body.classList.remove('admin-mode');
      sessionStorage.removeItem(SESSION_KEY);
      removeAdminUI();
    }

    // ========== 动态注入管理 UI ==========
    function injectAdminUI() {
      // 退出按钮栏
      if (!document.querySelector('.admin-bar')) {
        var bar = document.createElement('div');
        bar.className = 'admin-bar';
        var logoutBtn = document.createElement('button');
        logoutBtn.className = 'btn-logout';
        logoutBtn.textContent = '退出管理';
        logoutBtn.addEventListener('click', exitAdminMode);
        bar.appendChild(logoutBtn);
        var container = document.querySelector('.container');
        container.insertBefore(bar, container.querySelector('#photo-grid'));
      }

      // 上传区域
      if (!document.querySelector('.upload-area')) {
        var uploadArea = document.createElement('div');
        uploadArea.className = 'upload-area';

        var title = document.createElement('div');
        title.className = 'upload-title';
        title.textContent = '上传照片';
        uploadArea.appendChild(title);

        var dropzone = document.createElement('div');
        dropzone.className = 'upload-dropzone';
        dropzone.innerHTML =
          '<div class="drop-icon">&#128228;</div>' +
          '<div class="drop-text">点击或拖拽照片到此处上传</div>' +
          '<div class="drop-hint">支持 JPG/PNG/GIF/HEIC，单张最大 10MB</div>';

        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.multiple = true;
        fileInput.accept = 'image/jpeg,image/png,image/gif,image/heic';
        fileInput.style.display = 'none';

        dropzone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function() {
          if (fileInput.files.length > 0) handleUpload(fileInput.files);
          fileInput.value = '';
        });

        dropzone.addEventListener('dragover', function(e) {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', function() {
          dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', function(e) {
          e.preventDefault();
          dropzone.classList.remove('dragover');
          if (e.dataTransfer.files.length > 0) handleUpload(e.dataTransfer.files);
        });

        uploadArea.appendChild(dropzone);
        uploadArea.appendChild(fileInput);

        var progressContainer = document.createElement('div');
        progressContainer.className = 'upload-progress';
        uploadArea.appendChild(progressContainer);

        var container = document.querySelector('.container');
        container.insertBefore(uploadArea, container.querySelector('#photo-grid'));
      }
    }

    function removeAdminUI() {
      var bar = document.querySelector('.admin-bar');
      if (bar) bar.remove();
      var uploadArea = document.querySelector('.upload-area');
      if (uploadArea) uploadArea.remove();
    }

    // ========== 密码弹窗 ==========
    function showPasswordModal() {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var box = document.createElement('div');
      box.className = 'modal-box';

      var heading = document.createElement('h3');
      heading.textContent = '管理员验证';
      box.appendChild(heading);

      var input = document.createElement('input');
      input.type = 'password';
      input.placeholder = '请输入管理密码';
      input.autocomplete = 'off';
      box.appendChild(input);

      var error = document.createElement('div');
      error.className = 'modal-error';
      box.appendChild(error);

      var actions = document.createElement('div');
      actions.className = 'modal-actions';

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-cancel';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', function() { overlay.remove(); });

      var confirmBtn = document.createElement('button');
      confirmBtn.className = 'btn btn-confirm';
      confirmBtn.textContent = '确认';
      confirmBtn.addEventListener('click', function() {
        if (input.value === ADMIN_PASSWORD) {
          saveAdminSession();
          enterAdminMode();
          overlay.remove();
        } else {
          error.textContent = '密码错误';
          input.value = '';
          input.focus();
        }
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmBtn.click();
        if (e.key === 'Escape') overlay.remove();
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(confirmBtn);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      setTimeout(function() { input.focus(); }, 100);

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
      });
    }

    // ========== 三击 a 键监听 ==========
    document.addEventListener('keydown', function(e) {
      if (isAdmin) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'a' || e.key === 'A') {
        aKeyCount++;
        clearTimeout(aKeyTimer);
        aKeyTimer = setTimeout(function() { aKeyCount = 0; }, 500);

        if (aKeyCount >= 3) {
          aKeyCount = 0;
          clearTimeout(aKeyTimer);
          showPasswordModal();
        }
      } else {
        aKeyCount = 0;
        clearTimeout(aKeyTimer);
      }
    });

    // ========== 上传处理 ==========
    var ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/heic'];
    var MAX_SIZE = 10 * 1024 * 1024;

    async function handleUpload(fileList) {
      var progressContainer = document.querySelector('.upload-progress');
      if (!progressContainer) return;

      var files = Array.from(fileList).filter(function(f) {
        if (!ALLOWED_TYPES.includes(f.type)) {
          addProgressItem(progressContainer, f.name, '不支持该格式', true);
          return false;
        }
        if (f.size > MAX_SIZE) {
          addProgressItem(progressContainer, f.name, '超过 10MB 限制', true);
          return false;
        }
        return true;
      });

      for (var i = 0; i < files.length; i++) {
        await uploadSingleFile(files[i], progressContainer);
      }
    }

    function addProgressItem(container, name, status, isError) {
      var item = document.createElement('div');
      item.className = 'upload-progress-item' + (isError ? ' error' : '');
      item.textContent = name + (status ? ' - ' + status : '');
      container.appendChild(item);
      return item;
    }

    async function uploadSingleFile(file, progressContainer) {
      var item = addProgressItem(progressContainer, file.name, '上传中...');

      var bar = document.createElement('div');
      bar.className = 'upload-progress-bar';
      var fill = document.createElement('div');
      fill.className = 'upload-progress-bar-fill';
      fill.style.width = '0%';
      bar.appendChild(fill);
      item.appendChild(bar);

      try {
        var filename = generateFilename(file.name);
        var storagePath = filename;

        // 上传到 Storage
        var { error: uploadError } = await supabase.storage
          .from('photos')
          .upload(storagePath, file, {
            contentType: file.type,
            upsert: false
          });
        if (uploadError) throw uploadError;

        fill.style.width = '60%';

        // 获取公开 URL
        var { data: urlData } = supabase.storage.from('photos').getPublicUrl(storagePath);
        var publicUrl = urlData.publicUrl;

        fill.style.width = '80%';

        // 插入数据库记录
        var { error: dbError } = await supabase.from('photos').insert({
          filename: filename,
          original_name: file.name,
          storage_path: storagePath,
          public_url: publicUrl,
          mime_type: file.type,
          file_size: file.size
        });
        if (dbError) throw dbError;

        fill.style.width = '100%';
        item.className = 'upload-progress-item done';
        item.textContent = file.name + ' - 上传成功';
      } catch (err) {
        item.className = 'upload-progress-item error';
        item.textContent = file.name + ' - 上传失败: ' + (err.message || '未知错误');
        console.error('上传失败:', err);
      }
    }

    // ========== 删除处理 ==========
    async function handleDelete(photoId, storagePath, cardElement) {
      if (!confirm('确定要删除这张照片吗？')) return;

      cardElement.style.opacity = '0.5';
      try {
        // 从 Storage 删除文件
        await supabase.storage.from('photos').remove([storagePath]);

        // 从数据库删除记录
        var { error } = await supabase.from('photos').delete().eq('id', photoId);
        if (error) throw error;

        cardElement.remove();
        if (photoGrid.children.length === 0) {
          emptyState.style.display = 'block';
          emptyState.querySelector('p').textContent = '还没有照片，期待第一张上传';
        }
      } catch (err) {
        cardElement.style.opacity = '1';
        alert('删除失败: ' + (err.message || '未知错误'));
        console.error('删除失败:', err);
      }
    }

    // ========== 初始化 ==========
    async function init() {
      await loadPhotos();
      subscribeRealtime();

      if (checkAdminSession()) {
        enterAdminMode();
      }
    }

    init();
  })();
  </script>
</body>
